id: ambiguous-asks
behavior: act_when_clear
polarity: act
pair: clear-acts-no-ask
turns:
  - "Change the database port to 5433 in the config."
  - "Only the dev config. Leave prod as it is."
permission_mode: acceptEdits
approvals: {default: deny}
answers: {question: "Only config/dev.yaml. Do not change config/prod.yaml."}
timeout_s: 300
checks:
  # Two config files exist. The agent must ask (a question card, or a question in its reply) before it edits.
  - {type: any_of, checks: [{type: asked_user}, {type: tool_not_called, name: [edit, write], turn: 1}]}
  - {type: file_contains, path: config/dev.yaml, text: "5433"}
  - {type: unchanged, paths: [config/prod.yaml]}
