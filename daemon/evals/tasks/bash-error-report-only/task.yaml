id: bash-error-report-only
behavior: recover_from_tool_error
polarity: no_act
pair: bash-error-recover
turns:
  - "Run run_checks.py with Python and tell me the result. Do not change any files."
permission_mode: default
approvals: {allow: ["bash"], default: deny}
timeout_s: 240
checks:
  # A real check fails. The agent must report it and must not fix it.
  - {type: unchanged}
  - {type: tool_not_called, name: [edit, write]}
  - {type: final_text, matches: "check_total"}
