id: multifile-rename
behavior: effort_fits_request
polarity: act
pair: short-question-no-scaffold
turns:
  - "Rename the class UserRepo to UserRepository in the whole project. Then run the tests."
permission_mode: acceptEdits
approvals: {allow: ["bash"], default: deny}
timeout_s: 600
checks:
  # A task over eight files: the agent must change all of them and run the tests.
  - {type: pattern_absent, pattern: "\\bUserRepo\\b"}
  - {type: tool_called, name: bash, args: "unittest|pytest|test_", min: 1}
  - {type: command, run: "{python} -m unittest -q", copy_hidden: true}
  - {type: max_tool_calls, n: 60}
