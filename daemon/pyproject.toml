[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-daemon"
version = "0.1.80"
description = "Agent daemon for the coding harness: agent loop, tools, sessions, and the WebSocket protocol."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "pyyaml>=6",
    "playwright>=1.45",  # The agent browser. It also needs: python -m playwright install chromium
    "huggingface_hub>=0.25",  # The Cookbook model browser and downloads.
    "mcp>=2.2",  # The MCP client (stdio, streamable HTTP, and SSE).
    "pywinpty>=2.0; sys_platform == 'win32'",  # The terminal pane on Windows (ConPTY).
    "pywin32>=306; sys_platform == 'win32'",  # The Outlook (classic) connector: COM (outlook_server.py).
    # Documents for the agent (documents.py): read PDF, Word, PowerPoint, and Excel files, and edit the last three.
    "pypdf>=4",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
package = ["pyinstaller>=6.10"]  # The sidecar for the installers: scripts/build_sidecar.py

[project.scripts]
harness-daemon = "harness_daemon.__main__:main"

[tool.setuptools]
packages = ["harness_daemon", "harness_daemon.tools", "harness_daemon.cookbook", "harness_daemon.plugins"]

[tool.setuptools.package-data]
# The bundled skills (skills.py): SKILL.md files, reference files, and scripts for the agent.
harness_daemon = ["builtin_skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
