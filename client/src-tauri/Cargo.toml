[package]
name = "harness"
version = "0.1.31"
license = "MIT"
description = "Desktop client for the coding harness"
edition = "2021"

[lib]
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-window-state = "2"

# The keychain of each operating system, for the tokens of remote daemons.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The screenshot of a Browser pane tab: WebView2 CapturePreview. The same versions as wry.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
