# The installers for Windows, macOS, and Linux (SPEC.md section 10, phase 13).
#
# A tag v* starts the workflow, or start it by hand (workflow_dispatch).
# Each job builds the daemon sidecar with PyInstaller, then the Tauri installers.
# PyInstaller cannot cross-compile, so each operating system and CPU type has its own job.
# A tag also makes a draft GitHub release with the installers, their .sig files, and latest.json.
# The installed apps find a new version only after the draft is published (docs/RELEASE.md).
#
# The secret TAURI_SIGNING_PRIVATE_KEY is the text of the release key (~/.tauri/harness-updater.key).
# The build signs the update files with it. The key has no password.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
            arch: aarch64
          - os: macos-15-intel
            name: macos-x64
            arch: x86_64
          # The oldest supported Ubuntu gives the widest glibc support for the AppImage.
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            plugin-host/package-lock.json

      - name: Install the daemon
        run: python -m pip install -e "./daemon[package,dev]"

      - name: Install the plugin host packages
        working-directory: plugin-host
        run: npm ci --omit=dev --ignore-scripts

      - name: Test the plugin host
        working-directory: plugin-host
        shell: bash
        run: |
          NODE=$(python -c "from playwright._impl._driver import compute_driver_executable as c; print(c()[0])")
          "$NODE" --test "test/*.test.mjs"

      - name: Test the daemon
        working-directory: daemon
        run: python -m pytest -q

      - name: Build the sidecar
        working-directory: daemon
        run: python scripts/build_sidecar.py

      - name: Install the client packages
        working-directory: client
        run: npm ci

      - name: Test the client
        working-directory: client
        run: |
          npm test
          npm run typecheck

      - name: Build the installers
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run package

      # The arm64 and the x64 jobs both make Harness.app.tar.gz: add the version and the CPU type.
      - name: Name the macOS update file
        if: runner.os == 'macOS'
        shell: bash
        working-directory: client/src-tauri/target/release/bundle/macos
        run: |
          VERSION=$(node -p "require('../../../../tauri.conf.json').version")
          for f in Harness.app.tar.gz Harness.app.tar.gz.sig; do
            if [ -f "$f" ]; then mv "$f" "${f/Harness.app/Harness_${VERSION}_${{ matrix.arch }}.app}"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.name }}
          if-no-files-found: error
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/nsis/*.exe.sig
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The update file of the Tauri updater: the version, and the URL and signature of each platform.
      - name: Make latest.json
        run: python3 .github/scripts/latest_json.py installers "${{ github.ref_name }}" "${{ github.repository }}"

      - name: Make a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installers/* --draft --generate-notes --repo "${{ github.repository }}"
