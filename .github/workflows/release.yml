# The installers for Windows, macOS, and Linux (SPEC.md section 10, phase 13).
#
# A tag v* starts the workflow, or start it by hand (workflow_dispatch).
# Each job builds the daemon sidecar with PyInstaller, then the Tauri installers.
# PyInstaller cannot cross-compile, so each operating system and CPU type has its own job.
# Windows has an x64 job and an ARM64 job (windows-11-arm runner, Harness_<version>_arm64-setup.exe).
# A tag also makes a draft GitHub release with the installers, their .sig files, and latest.json.
# The installed apps find a new version only after the draft is published (docs/RELEASE.md).
# If the release of the tag exists already, the workflow replaces its files.
#
# By hand with the input "tag" (for example v0.1.34): build that tag, and put the files on its
# release. By hand with no tag: build the branch only, with no release.
# By hand with "tag" and "ref": build the code of "ref" (a branch or a commit), and put the files
# on the release of "tag". The tag does not move. Use it to fix a failed build of a tag, when the
# fix must not change the tag. The version in the code of "ref" must be the version of the tag.
#
# The secret TAURI_SIGNING_PRIVATE_KEY is the text of the release key (~/.tauri/harness-updater.key).
# The build signs the update files with it. The key has no password.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Build this tag and put the files on its release, for example v0.1.34. Empty: build the branch only."
        required: false
        default: ""
      ref:
        description: "With a tag: build this branch, or this commit (the full 40-character hash), instead of the code of the tag. Empty: the tag."
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          # Native Windows on ARM. Python 3.12: Python 3.11 has no ARM64 wheel of PyYAML.
          # Tauri builds for the target, so the files are in target/aarch64-pc-windows-msvc/release.
          # Not tested on a real ARM64 computer yet: a failure of this job does not stop the release.
          - os: windows-11-arm
            name: windows-arm64
            python: "3.12"
            python-arch: arm64
            target: aarch64-pc-windows-msvc
            optional: true
          - os: macos-latest
            name: macos-arm64
            arch: aarch64
          - os: macos-15-intel
            name: macos-x64
            arch: x86_64
          # The oldest supported Ubuntu gives the widest glibc support for the AppImage.
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    # The release job needs all build jobs. An optional job counts as a success when it fails.
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf file

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.11' }}
          architecture: ${{ matrix.python-arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install the daemon
        run: python -m pip install -e "./daemon[package,dev]"

      - name: Test the daemon
        working-directory: daemon
        run: python -m pytest -q

      - name: Build the sidecar
        working-directory: daemon
        run: python scripts/build_sidecar.py

      - name: Install the client packages
        working-directory: client
        run: npm ci

      - name: Test the client
        working-directory: client
        run: |
          npm test
          npm run typecheck

      # The installer uses the HarnessUI NSIS plugin. Build it from its source, not from the committed
      # DLL. The NSIS zip is the one that Tauri downloads (the same address and SHA-1).
      - name: Build the NSIS plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\nsis-3.11.zip"
          Invoke-WebRequest https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA1).Hash -ne "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D") {
            throw "The NSIS zip has the wrong SHA-1."
          }
          Expand-Archive $zip "$env:RUNNER_TEMP\nsis"
          $api = Get-ChildItem "$env:RUNNER_TEMP\nsis" -Recurse -Directory -Filter Plugin |
            Where-Object { Test-Path "$($_.FullName)\nsis\pluginapi.h" } | Select-Object -First 1
          if (-not $api) { throw "The NSIS zip has no Examples\Plugin folder." }
          $env:NSIS_PLUGIN_API = $api.FullName
          $dll = "client\src-tauri\nsis\plugins\x86-unicode\HarnessUI.dll"
          Remove-Item $dll
          cmd /c client\src-tauri\nsis\plugin\build.cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dll)) { throw "The NSIS plugin did not build." }

      - name: Build the installers
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TARGET: ${{ matrix.target }}
        shell: bash
        run: npm run package -- ${TARGET:+--target "$TARGET"}

      # The app and the sidecar must be ARM64 programs (PE machine 0xAA64), and the installer must be
      # Harness_<version>_arm64-setup.exe: latest_json.py reads the name.
      - name: Check the ARM64 build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          ls -la client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/
          ls client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*_arm64-setup.exe
          python - client/src-tauri/target/${{ matrix.target }}/release/harness.exe \
            client/src-tauri/binaries/harness-daemon/harness-daemon.exe <<'EOF'
          import struct, sys
          for path in sys.argv[1:]:
              data = open(path, "rb").read(4096)
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              print(f"{path}: machine 0x{machine:04X}")
              if machine != 0xAA64:
                  sys.exit(f"{path} is not an ARM64 program.")
          EOF

      # The arm64 and the x64 jobs both make Harness.app.tar.gz: add the version and the CPU type.
      - name: Name the macOS update file
        if: runner.os == 'macOS'
        shell: bash
        working-directory: client/src-tauri/target/release/bundle/macos
        run: |
          VERSION=$(node -p "require('../../../../tauri.conf.json').version")
          for f in Harness.app.tar.gz Harness.app.tar.gz.sig; do
            if [ -f "$f" ]; then mv "$f" "${f/Harness.app/Harness_${VERSION}_${{ matrix.arch }}.app}"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.name }}
          if-no-files-found: error
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/nsis/*.exe.sig
            client/src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*.exe
            client/src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The tag of the release: the pushed tag, or the "tag" input of a run by hand.
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "The tag must look like v0.1.34: $TAG"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Each artifact keeps the bundle folders (nsis/, macos/, ...): put all the files in one folder.
      - name: Put the files in one folder
        run: |
          find installers -mindepth 2 -type f -exec mv -t installers {} +
          find installers -mindepth 1 -type d -empty -delete
          ls -la installers

      # The update file of the Tauri updater: the version, and the URL and signature of each platform.
      - name: Make latest.json
        run: python3 .github/scripts/latest_json.py installers "$TAG" "$REPO"

      # A new tag gets a draft release. If the release of the tag exists already (a rebuild, or a
      # moved tag), its files with the same names are replaced, and the release keeps its state.
      - name: Make or update the release
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" installers/* --draft --generate-notes --repo "$REPO"
          fi
